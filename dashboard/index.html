<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة تحكم كيدز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- شاشة تسجيل الدخول / إنشاء حساب -->
  <div id="authView" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-logo">🧒</span>
        <h1>لوحة تحكم كيدز</h1>
      </div>
      <p class="auth-sub">تابع الأجهزة والمواقع والاتصالات من مكان واحد</p>

      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">تسجيل الدخول</button>
        <button id="tabSignup" class="auth-tab" type="button">إنشاء حساب</button>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <label class="field">
          <span>البريد الإلكتروني</span>
          <input id="loginEmail" class="input" type="email" required autocomplete="email" placeholder="you@example.com" />
        </label>
        <label class="field">
          <span>كلمة المرور</span>
          <input id="loginPass" class="input" type="password" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        <button class="btn primary block" type="submit">دخول</button>
      </form>

      <form id="signupForm" class="auth-form hidden" novalidate>
        <label class="field">
          <span>الاسم</span>
          <input id="signupName" class="input" type="text" placeholder="اسم ولي الأمر" />
        </label>
        <label class="field">
          <span>البريد الإلكتروني</span>
          <input id="signupEmail" class="input" type="email" required autocomplete="email" placeholder="you@example.com" />
        </label>
        <label class="field">
          <span>كلمة المرور (6 أحرف على الأقل)</span>
          <input id="signupPass" class="input" type="password" required minlength="6" autocomplete="new-password" placeholder="••••••••" />
        </label>
        <button class="btn primary block" type="submit">إنشاء الحساب</button>
      </form>

      <div id="authError" class="error-box hidden" role="alert"></div>
      <p class="auth-hint">تأكد من تفعيل <b>Email/Password</b> في Firebase Authentication.</p>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">🧒</span>
        <span class="brand-name">لوحة تحكم كيدز</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <button id="logoutBtn" class="btn ghost block" type="button">🚪 تسجيل الخروج</button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-group">
          <label class="field-inline">
            <span>الجهاز</span>
            <select id="deviceSelect" class="input select"></select>
          </label>
          <span id="syncStatus" class="sync-status"><span class="dot"></span><span>—</span></span>
        </div>
        <div class="topbar-group">
          <label class="switch">
            <input type="checkbox" id="demoSwitch" />
            <span class="switch-label">وضع تجريبي</span>
          </label>
          <span id="userEmail" class="user-email"></span>
        </div>
      </header>
      <main id="main" class="main"></main>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
